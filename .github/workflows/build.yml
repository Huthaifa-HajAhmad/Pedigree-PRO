name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  native-database:
    name: Native encryption (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Install Linux desktop development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare static SQLite3 Multiple Ciphers
        run: node --test scripts/native-database-build.test.mjs
      - name: Test linked encryption engine and existing SQLCipher files
        run: cargo test --manifest-path artifacts/ppro/src-tauri/Cargo.toml -p ppro-database --locked
      - name: Check desktop application
        run: cargo check --manifest-path artifacts/ppro/src-tauri/Cargo.toml -p pedigree-pro --locked

  # ── Type Checking & Security Audit ───────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run check:tauri-commands
      - run: pnpm audit --audit-level=critical

  # ── Unit Tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - run: pnpm run test

  # ── E2E Smoke Tests (Playwright) ─────────────────────────────
  e2e:
    needs: [typecheck, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright Tests
        run: pnpm --filter @workspace/ppro test:e2e

  # ── Tauri Desktop Build (Windows) ────────────────────────────
  build-tauri-windows:
    needs: [typecheck, test, e2e, native-database]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@850ea1d4c207914842183c50979bf39aafeaa1f4 # v0.5.17
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Tauri Desktop Build (macOS) ──────────────────────────────
  build-tauri-macos:
    needs: [typecheck, test, e2e, native-database]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - name: Install Rust stable with Apple targets
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@850ea1d4c207914842183c50979bf39aafeaa1f4 # v0.5.17
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          args: '--target universal-apple-darwin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Tauri Desktop Build (Linux) ──────────────────────────────
  build-tauri-linux:
    needs: [typecheck, test, e2e, native-database]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@850ea1d4c207914842183c50979bf39aafeaa1f4 # v0.5.17
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Static Web Frontend Deployment ───────────────────────────
  deploy-web:
    needs: [typecheck, test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - run: pnpm --filter @workspace/ppro build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy artifacts/ppro/dist/public --project-name=pedigree-pro --branch=main

  # ── Cloudflare Workers Relay Deployment ──────────────────────
  deploy-relay:
    needs: [typecheck, test, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with: { version: '9' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Deploy Relay Worker
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: services/relay
          command: deploy
