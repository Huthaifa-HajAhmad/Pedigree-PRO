name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Type Checking ────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present run build
      - run: pnpm run typecheck

  # ── Unit Tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present run build
      - run: pnpm run test

  # ── Tauri Desktop Build (Windows) ────────────────────────────
  build-tauri-windows:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present run build
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__ (Windows)'
          releaseBody: 'See CHANGELOG.md for details.'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  # ── Tauri Desktop Build (macOS) ──────────────────────────────
  build-tauri-macos:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present run build
      - run: rustup target add aarch64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__ (macOS)'
          args: '--target universal-apple-darwin'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  # ── Tauri Desktop Build (Linux) ──────────────────────────────
  build-tauri-linux:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present run build
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__ (Linux)'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  # ── Static Web Frontend Deployment ───────────────────────────
  deploy-web:
    needs: typecheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm -r --if-present run build
      - run: pnpm --filter @workspace/ppro build
      - run: echo '/* /index.html 200' > artifacts/ppro/dist/public/_redirects
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: pedigree-pro
          directory: artifacts/ppro/dist/public
