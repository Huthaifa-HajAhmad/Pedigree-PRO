name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Type Checking ────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - run: pnpm run typecheck
      - run: pnpm run lint

  # ── Unit Tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - run: pnpm run test

  # ── Tauri Desktop Build (Windows) ────────────────────────────
  build-tauri-windows:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - name: Install Perl for vendored-openssl
        run: choco install strawberryperl -y --no-progress
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # ── Tauri Desktop Build (macOS) ──────────────────────────────
  build-tauri-macos:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - name: Install Rust stable with Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          args: '--target universal-apple-darwin'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # ── Tauri Desktop Build (Linux) ──────────────────────────────
  build-tauri-linux:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD || secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  # ── Static Web Frontend Deployment ───────────────────────────
  deploy-web:
    needs: [typecheck, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - run: pnpm --filter @workspace/ppro build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy artifacts/ppro/dist/public --project-name=pedigree-pro --branch=main