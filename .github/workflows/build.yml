name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Type Checking ────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - run: pnpm run typecheck

  # ── Unit Tests ───────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - run: pnpm run test

  # ── Tauri Desktop Build (Windows) ────────────────────────────
  build-tauri-windows:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - name: Install OpenSSL for SQLCipher
        shell: pwsh
        run: |
          choco install openssl -y --no-progress
          $sslBase = "C:\Program Files\OpenSSL-Win64"
          if (!(Test-Path "$sslBase\include\openssl\crypto.h")) {
            $sslBase = "C:\OpenSSL-Win64"
          }
          $sslLib = Get-ChildItem -Path "$sslBase\lib" -Recurse -Filter "libcrypto.lib" | Select-Object -First 1
          if ($null -eq $sslLib) {
            $sslLib = Get-ChildItem -Path "$sslBase" -Recurse -Filter "libcrypto.lib" | Select-Object -First 1
          }
          $libDir = Split-Path $sslLib.FullName
          Write-Host "OPENSSL_DIR=$sslBase"
          Write-Host "OPENSSL_LIB_DIR=$libDir"
          Write-Host "OPENSSL_INCLUDE_DIR=$sslBase\include"
          echo "OPENSSL_DIR=$sslBase" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=$sslBase\include" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
          # Copy runtime DLLs for Tauri bundle (tauri.windows.conf.json)
          $dstDir = "artifacts/ppro/src-tauri"
          foreach ($dll in @("libcrypto-4-x64.dll", "libssl-4-x64.dll")) {
            $src = Get-ChildItem -Path $sslBase -Recurse -Filter $dll | Select-Object -First 1
            if ($src) {
              Copy-Item $src.FullName -Destination $dstDir -Force
              Write-Host "Copied $($dll) from $($src.FullName)"
            } else {
              Write-Host "WARNING: $dll not found in $sslBase"
            }
          }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  # ── Tauri Desktop Build (macOS) ──────────────────────────────
  build-tauri-macos:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - name: Install Rust stable with Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          args: '--target universal-apple-darwin'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  # ── Tauri Desktop Build (Linux) ──────────────────────────────
  build-tauri-linux:
    needs: [typecheck, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: artifacts/ppro
          tagName: ${{ github.ref_name }}
          releaseName: 'Pedigree PRO v__VERSION__'
          releaseBody: 'See CHANGELOG.md for details.'
          includeUpdaterJson: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  # ── Static Web Frontend Deployment ───────────────────────────
  deploy-web:
    needs: typecheck
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '9' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/browser-backend run build
      - run: pnpm --filter @workspace/api-client-react exec tsc -p tsconfig.json
      - run: pnpm --filter @workspace/ppro build
      - run: echo '/* /index.html 200' > artifacts/ppro/dist/public/_redirects
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy artifacts/ppro/dist/public --project-name=pedigree-pro --branch=main