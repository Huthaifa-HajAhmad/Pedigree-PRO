name: Feature Request
description: Suggest a new clinical feature, export format, or UX enhancement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature to improve Pedigree PRO!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or clinical workflow limitation?
      placeholder: "When constructing complex consanguineous pedigrees, it is difficult to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.

  - type: dropdown
    id: domain
    attributes:
      label: Feature Domain
      options:
        - "Pedigree Layout Engine & Spacing"
        - "Clinical Annotations (HPO/OMIM/HGVS)"
        - "Risk Calculation & Genetics Math"
        - "Export Formats (PDF, PPTX, FHIR, GA4GH)"
        - "Offline Persistence & Security"
        - "UI / Usability & Accessibility"
        - "Other"
    validations:
      required: true
