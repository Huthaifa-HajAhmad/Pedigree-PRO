<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedigree PRO</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var theme = "clinical";
        var legacyMap = { amber: "warm", rose: "daylight" };
        try {
          var v = localStorage.getItem("ppro_theme") || localStorage.getItem("pedigree-pro-theme");
          if (v) v = legacyMap[v] || v;
          if (["terminal","clinical","midnight","arctic","daylight","warm"].indexOf(v) !== -1) theme = v;
        } catch(e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
