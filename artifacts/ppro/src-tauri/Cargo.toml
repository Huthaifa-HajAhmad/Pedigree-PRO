[package]
name = "pedigree-pro"
version = "1.4.0"
description = "Pedigree PRO — Secure Clinical Pedigree Platform"
authors = ["Pedigree PRO Contributors"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[lib]
name = "pedigree_pro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2" }
tauri-plugin-fs = { version = "2" }
tauri-plugin-shell = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "3", features = ["rand_core"] }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
pbkdf2 = { version = "0.13", features = ["hmac"] }
dirs = "6"
keyring = "4.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.dev.package."*"]
opt-level = 3
