[package]
name = "pedigree-pro"
version = "0.1.0"
description = "Pedigree PRO — Secure Clinical Pedigree Platform"
authors = ["Pedigree PRO Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pedigree_pro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = { version = "2.0.0-alpha" }
tauri-plugin-shell = { version = "2.0.0-alpha" }
tauri-plugin-updater = { version = "2.0.0-alpha" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["sqlcipher", "bundled"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
pbkdf2 = { version = "0.12", features = ["hmac"] }
